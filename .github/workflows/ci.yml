# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  package:
    name: Package Toga Bitmap View
    uses: beeware/.github/.github/workflows/python-package-create.yml@main
    permissions:
      id-token: write
      contents: read
      attestations: write

  style:
    name: Test ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.2

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6.2.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  test:
    name: Test ${{ matrix.platform }} ${{ matrix.python-version }}
    runs-on: ${{ matrix.platform }}
    needs: [ package ]
    strategy:
      fail-fast: false
      matrix:
        platform: [ "macos-latest", "ubuntu-latest", "windows-latest" ]
        python-version: [ "3.13" ]
    runs-on: ${{ matrix.platform }}

    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.2

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6.2.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Get Packages
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        pattern: "Packages-*"
        merge-multiple: true
        path: dist

    - name: Install linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt update -y
        sudo apt install -y --no-install-recommends \
          blackbox pkg-config python3-dev libgirepository-2.0-dev libcairo2-dev \
          gir1.2-webkit2-4.1 gir1.2-xapp-1.0 gir1.2-geoclue-2.0 gir1.2-flatpak-1.0

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ./dist/toga_bitmap_view-*.whl --group test

    - name: Test with pytest
      env:
        TOGA_BACKEND: toga_dummy
      run: |
        pytest tests
